<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>9999+ Weapons: Idle RPG &mdash; Tier 9 Game Studios</title>
    <meta name="description" content="9999+ Weapons: Idle RPG, an idle auto-battler RPG from Tier 9 Game Studios. Play the free demo on Steam, or the early access on Google Play."/>
    <meta name="robots" content="noindex"/>
    <meta property="og:title" content="9999+ Weapons: Idle RPG"/>
    <meta property="og:description" content="An idle auto-battler RPG from Tier 9 Game Studios. Play the free demo on Steam, or the early access on Google Play."/>
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://www.tier9studios.com/abw/"/>
    <meta property="og:image" content="https://www.tier9studios.com/assets/bg.jpg"/>
    <meta name="theme-color" content="#29d5ef"/>
    <link rel="icon" type="image/png" href="/assets/logo.png"/>
    <link rel="preload" href="/assets/abw/brotato-hop.webp" as="image" type="image/webp"/>
    <style>
        :root {
            --ink: #1a1c23;
            --ink-dim: #3d414c;
            --accent: #e8434f;
            --blurple: #5865f2;
            --steam: #171a21;
            /* One background tile is 1382 x 1019 px; the scene is one viewport tall, so a tile is this wide. */
            --tile: calc(100vh * 1382 / 1019);
            /* Display height of one 128-px floor tile from the game's grassland tile sheet. */
            --cell: clamp(48px, 8vh, 104px);
        }
        @font-face {
            font-family: "Ioskeley Mono";
            src: url("/assets/fonts/IoskeleyMonoTerm-Regular.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: "Ioskeley Mono";
            src: url("/assets/fonts/IoskeleyMonoTerm-SemiBold.woff2") format("woff2");
            font-weight: 600;
            font-display: swap;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: #29d5ef;
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }
        /* The W1 grassland battle background (Hillside prefab), anchored to the bottom of the screen.
           100vh is the largest viewport height on mobile, so the scene never comes up short when the toolbar hides. */
        .scene {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }
        .layer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            background-repeat: repeat-x;
            background-size: auto 100%;
        }
        .sky { background-image: url("/assets/abw/sky.webp"); }
        .land { background-image: url("/assets/abw/land.webp"); }
        /* The clouds drift right, as they do in the game: one tile width per loop. */
        .clouds {
            left: calc(-1 * var(--tile));
            width: calc(100% + var(--tile));
            background-image: url("/assets/abw/clouds.webp");
            animation: drift 110s linear infinite;
            will-change: transform;
        }
        @keyframes drift {
            to { transform: translateX(var(--tile)); }
        }
        /* The ground: a grass-topped row of W1 grassland tiles over dirt (one 192 x 512 px column per repeat). */
        .floor {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: calc(var(--cell) * 2.4);
            background: url("/assets/abw/floor.webp") 0 0 / auto calc(var(--cell) * 4) repeat-x;
        }
        /* Each Brotato is one frame of an 8-frame hop sheet (176 x 343 px per frame). Its art faces left. */
        .brotato {
            position: absolute;
            left: 0;
            bottom: 0;
            background: url("/assets/abw/brotato-hop.webp") 0 0 / 800% 100% no-repeat;
            transform-origin: 50% 100%;
            will-change: transform;
        }
        /* Fixed scrim behind the footer so its text stays readable on any artwork. */
        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 7rem;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(to top, rgba(10, 40, 20, 0.55), rgba(10, 40, 20, 0));
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Keep the floor and the Brotatos on it clear of the card: 2.4 tiles of floor plus about 1 tile of Brotato. */
            padding: 2.5rem 1.25rem calc(var(--cell) * 3.4);
        }
        .glass {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 34rem;
            padding: 3rem 2.5rem 2.5rem;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.66);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 16px 48px rgba(10, 45, 80, 0.22);
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass { background: rgba(255, 255, 255, 0.93); }
        }
        .logo {
            width: min(300px, 68vw);
            height: auto;
            margin-bottom: 2rem;
        }
        h1 {
            margin: 0 0 0.4rem;
            font-family: "Ioskeley Mono", ui-monospace, monospace;
            font-size: clamp(1.5rem, 4.5vw, 1.9rem);
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }
        .kicker {
            margin: 0 0 0.5rem;
            color: var(--ink-dim);
            font-size: 1.02rem;
            font-weight: 500;
        }
        .tagline {
            margin: 0 0 2rem;
            color: var(--ink-dim);
            font-size: 1.02rem;
            font-weight: 500;
            max-width: 28rem;
        }
        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 10.25rem;
            height: 50px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            text-decoration: none;
        }
        .badge-store { background: #000000; }
        .badge-steam { background: var(--steam); }
        .badge-discord { background: var(--blurple); }
        .badge svg {
            width: 26px;
            height: 26px;
            flex: none;
            fill: currentColor;
        }
        .badge .lines {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.15;
        }
        .badge .small {
            font-size: 0.6rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .badge .big {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .hiring {
            margin-top: 2rem;
            display: inline-block;
            padding: 0.35rem 1rem;
            border: 1px solid var(--ink-dim);
            border-radius: 999px;
            color: var(--ink-dim);
            font-family: "Ioskeley Mono", ui-monospace, monospace;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
        }
        .hiring:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        footer {
            padding: 0 1.5rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3rem 1.25rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 1px 6px rgba(10, 40, 20, 0.5);
        }
        footer a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
        }
        footer a:hover { text-decoration: underline; }
        /* This card carries more text than the home page; tighten vertical rhythm so it fits a 900px-tall window. */
        .glass { padding-top: 2.25rem; }
        .logo { width: min(240px, 60vw); margin-bottom: 1.25rem; }
        .hiring { margin-top: 1.5rem; }
        @media (max-width: 480px) {
            .badge { height: 42px; }
            .badge .big { font-size: 1rem; }
        }
        @media (max-aspect-ratio: 3 / 4) {
            main { padding: clamp(1rem, 3.5vh, 2rem) 0 calc(var(--cell) * 3.4); }
            .glass {
                width: min(84vw, 30rem);
                padding: clamp(1.4rem, 3.5vh, 2.25rem) clamp(0.9rem, 4vw, 1.5rem) clamp(1.2rem, 3vh, 1.75rem);
                border-radius: clamp(16px, 5vw, 22px);
            }
            .logo {
                width: clamp(10rem, 55vw, 14rem);
                margin-bottom: clamp(1rem, 2.5vh, 1.5rem);
            }
            h1 { font-size: clamp(1.3rem, 5.5vw, 1.65rem); }
            .kicker { font-size: clamp(0.9rem, 3.8vw, 0.98rem); }
            .tagline {
                margin-bottom: clamp(1.1rem, 3vh, 1.5rem);
                font-size: clamp(0.9rem, 3.8vw, 0.98rem);
            }
            .badges {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
                /* Cap at two badge widths + gap so badges never stretch wider than designed. */
                max-width: calc(20.5rem + 0.55rem);
                gap: 0.55rem;
            }
            .badge {
                width: 100%;
                height: clamp(38px, 10.5vw, 44px);
                gap: 0.4rem;
            }
            .badge-discord {
                grid-column: 1 / -1;
                justify-self: center;
                width: calc(50% - 0.275rem);
            }
            .badge svg { width: 22px; height: 22px; }
            .badge .small { font-size: 0.52rem; }
            .badge .big { font-size: 0.95rem; }
            .hiring {
                margin-top: clamp(1.1rem, 3vh, 1.5rem);
                font-size: 0.84rem;
            }
            footer {
                padding: 0 1rem max(1rem, env(safe-area-inset-bottom));
                font-size: 0.8rem;
            }
        }
        @media (max-width: 350px) and (max-aspect-ratio: 3 / 4) {
            .glass { width: 90vw; }
            .badges {
                grid-template-columns: minmax(0, 10rem);
                justify-content: center;
            }
            .badge-discord {
                grid-column: auto;
                width: 100%;
            }
        }
        @media (max-height: 600px) and (min-aspect-ratio: 4 / 3) {
            main { padding: 0.75rem 1rem; }
            .glass { max-width: 34rem; padding: 1rem 1.5rem 0.9rem; }
            .logo {
                width: min(150px, 22vw);
                margin-bottom: 0.5rem;
            }
            h1 { font-size: 1.25rem; }
            .tagline {
                margin-bottom: 0.75rem;
                font-size: 0.85rem;
            }
            .badges { gap: 0.5rem; }
            .badge {
                width: 9.5rem;
                height: 36px;
                gap: 0.4rem;
            }
            .badge svg { width: 21px; height: 21px; }
            .badge .small { font-size: 0.5rem; }
            .badge .big { font-size: 0.9rem; }
            .hiring {
                margin-top: 0.75rem;
                padding: 0.2rem 0.8rem;
                font-size: 0.8rem;
            }
            footer {
                padding-bottom: 0.5rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="scene" aria-hidden="true">
        <div class="layer sky"></div>
        <div class="layer clouds"></div>
        <div class="layer land"></div>
        <div class="floor"></div>
        <div class="layer critters"></div>
    </div>
    <main>
        <div class="glass">
            <img class="logo" src="/assets/logo.png" alt="Tier 9 Game Studios" width="900" height="648"/>
            <p class="kicker">You seem to have stumbled upon&hellip;</p>
            <h1>9999+ Weapons: Idle RPG</h1>
            <p class="tagline">Our take on an open World Idle 2D RPG. Play the free demo on Steam, or the Early Access on Google Play</p>
            <div class="badges">
                <a class="badge badge-steam" href="https://store.steampowered.com/app/3510430/">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 4a5.5 5.5 0 1 1 -.309 10.992l-.078 -.007l-3.646 2.524l-.011 .094c-.267 1.775 -1.707 3.18 -3.571 3.38l-.209 .017h-.176a4 4 0 0 1 -3.756 -2.623l-.016 -.048l-2.122 -.91a1 1 0 0 1 -.599 -.8l-.007 -.119v-3.5a1 1 0 0 1 1.447 -.894l2.964 1.481l.174 -.1a4 4 0 0 1 2.15 -.482l.166 .014l2.126 -2.977l-.01 -.098a5.5 5.5 0 0 1 1.092 -3.758l.169 -.212a5.5 5.5 0 0 1 4.222 -1.974m0 3.5a2 2 0 1 0 0 4a2 2 0 0 0 0 -4"/></svg>
                    <span class="lines"><span class="small">Demo on</span><span class="big">Steam</span></span>
                </a>
                <a class="badge badge-store" href="https://play.google.com/store/apps/details?id=com.tier9.abw">
                    <svg viewBox="30 336.7 120.9 129.2" aria-hidden="true"><path fill="#ffd400" d="M119.2,421.2c15.3-8.4,27-14.8,28-15.3c3.2-1.7,6.5-6.2,0-9.7c-2.1-1.1-13.4-7.3-28-15.3l-20.1,20.2L119.2,421.2z"/><path fill="#ff3333" d="M99.1,401.1l-64.2,64.7c1.5,0.2,3.2-0.2,5.2-1.3c4.2-2.3,48.8-26.7,79.1-43.3L99.1,401.1L99.1,401.1z"/><path fill="#48ff48" d="M99.1,401.1l20.1-20.2c0,0-74.6-40.7-79.1-43.1c-1.7-1-3.6-1.3-5.3-1L99.1,401.1z"/><path fill="#3bccff" d="M99.1,401.1l-64.3-64.3c-2.6,0.6-4.8,2.9-4.8,7.6c0,7.5,0,107.5,0,113.8c0,4.3,1.7,7.4,4.9,7.7L99.1,401.1z"/></svg>
                    <span class="lines"><span class="small">Get it on</span><span class="big">Google Play</span></span>
                </a>
            </div>
            <a class="hiring" href="/">&larr; Tier 9 Game Studios</a>
        </div>
    </main>
    <footer>
        <span>&copy; Tier 9 Game Studios Ltd.</span>
        <a href="/privacy/">Privacy</a>
        <a href="/">Home</a>
    </footer>
    <script>
        // Brotatos hop across the screen on the grass line of the floor. Each one keeps its direction,
        // rests briefly between hops, and wraps to the other side when it hops off an edge.
        (function () {
            // Hop timing from the game: monsterSpriteResolverInfos row 1020 (brotato), walkFrames 8 at walkFps 6.
            var FRAMES = 8, FPS = 6, ASPECT = 176 / 343;
            var field = document.querySelector(".critters");
            var floor = document.querySelector(".floor");
            var critters = [];

            function rand(a, b) { return a + Math.random() * (b - a); }

            function spawn() {
                field.textContent = "";
                critters = [];
                var w = field.clientWidth;
                var floorH = floor.offsetHeight, cell = floorH / 2.4;
                var count = Math.max(3, Math.min(8, Math.round(w / 240)));
                for (var i = 0; i < count; i++) {
                    // Feet land in the grass band of the top tile row, between 45% and 65% of a tile down.
                    var sink = rand(0.45, 0.65);
                    var size = cell * rand(1.9, 2.2);
                    var el = document.createElement("div");
                    el.className = "brotato";
                    el.style.height = size + "px";
                    el.style.width = size * ASPECT + "px";
                    // Lower feet are nearer the viewer, so they draw in front.
                    el.style.zIndex = String(Math.round(sink * 100));
                    var c = {
                        el: el,
                        w: size * ASPECT,
                        y: -(floorH - cell * sink),
                        // Spread them out across the width so they do not start in a clump.
                        x: (i + rand(0, 0.8)) * w / count,
                        dir: Math.random() < 0.5 ? -1 : 1,
                        frame: 0,
                        clock: 0,
                        wait: rand(0, 1),
                        stride: size * 0.55
                    };
                    field.appendChild(el);
                    critters.push(c);
                    draw(c);
                }
            }

            function draw(c) {
                c.el.style.backgroundPosition = (c.frame * 100 / (FRAMES - 1)) + "% 0";
                // The art faces left, so mirror it when the Brotato heads right.
                c.el.style.transform = "translate3d(" + c.x + "px," + c.y + "px,0) scaleX(" + (-c.dir) + ")";
            }

            function step(c, dt, w) {
                if (c.wait > 0) {
                    c.wait -= dt;
                    return;
                }
                c.clock += dt;
                var f = Math.min(FRAMES - 1, Math.floor(c.clock * FPS));
                // Move only while the feet are off the ground (frames 2 to 6 of the hop).
                if (f >= 2 && f <= 6) c.x += c.dir * c.stride * FPS / 5 * dt;
                if (c.dir > 0 && c.x > w) c.x = -c.w;
                if (c.dir < 0 && c.x < -c.w) c.x = w;
                c.frame = f;
                if (c.clock * FPS >= FRAMES) {
                    c.frame = 0;
                    c.clock = 0;
                    // Mostly a short beat between hops; now and then a longer breather.
                    c.wait = Math.random() < 0.15 ? rand(0.8, 2) : rand(0.05, 0.35);
                }
                draw(c);
            }

            var last = 0;
            function tick(now) {
                // Clamp the step so a background tab does not teleport everyone on return.
                var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
                last = now;
                var w = field.clientWidth;
                for (var i = 0; i < critters.length; i++) step(critters[i], dt, w);
                requestAnimationFrame(tick);
            }

            // Respawn only when the width changes: mobile toolbars change the height on every scroll.
            var resizeTimer, lastWidth = window.innerWidth;
            window.addEventListener("resize", function () {
                if (window.innerWidth === lastWidth) return;
                lastWidth = window.innerWidth;
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(spawn, 200);
            });
            spawn();
            requestAnimationFrame(tick);
        })();
    </script>
</body>
</html>
